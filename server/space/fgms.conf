# Space Arena private listener. This bind is INSIDE the container on the
# internal bridge only; the default compose.json publishes no host port.
# Gateway/TLS/invites are NOT implemented: never expose this publicly.
# No personal IPs or credentials belong in this file.
server.name = SpaceArena
server.address = 0.0.0.0
server.port = 5000
server.telnet_port = 0
server.admin_cli = false
server.admin_port = 0
server.playerexpires = 10
server.logfile = /tmp/fgms.log
server.tracked = false
server.daemon = false
server.is_hub = false
server.out_of_reach = 100
server.max_radar_range = 100
# No relay.*, crossfeed, tracker host, telnet or admin endpoints.
